          description: Method not allowed.
  /api/v1/books/{book_id}/notes/:
    get:
      operationId: books_notes
      parameters:
      - in: path
        name: book_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: order
        schema:
          type: string
          enum:
          - chapter
          - newest
          - oldest
          - page
        description: Default oldest. Newest reverses capture order. Page sorts numerically
          with missing pages last and oldest captures first for ties. Chapter follows
          the Book's sequence with missing Chapters last, then the same page and capture
          ordering. UUID breaks final ties.
      - in: query
        name: page
        schema:
          type: integer
        description: 1-based page; 20 Notes.
      tags:
      - books
      security:
      - cookieAuth: []
      responses:
