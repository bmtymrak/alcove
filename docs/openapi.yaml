openapi: 3.1.0
info:
  title: Alcove API
  version: 1.0.0
  description: Private same-origin session API. Sign in at /login/ with CSRF. Send
    the csrftoken cookie in X-CSRFToken on POST/PATCH. Notes use stable UUIDs and
    UTC timestamps. See docs/api.md.
paths:
  /api/v1/books/:
    get:
      operationId: books_list
      parameters:
      - in: query
        name: page
        schema:
          type: integer
        description: 1-based page; 20 Books ordered by title then UUID.
      tags:
      - books
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookPage'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sign-in or CSRF required.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found in your Collection.
        '405':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Method not allowed.
    post:
      operationId: books_create
      tags:
      - books
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sign-in or CSRF required.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found in your Collection.
        '405':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Method not allowed.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid fields or JSON.
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Send application/json.
  /api/v1/books/{book_id}/:
    get:
      operationId: books_read
      parameters:
      - in: path
        name: book_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - books
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sign-in or CSRF required.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found in your Collection.
        '405':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Method not allowed.
    patch:
      operationId: books_edit
      parameters:
      - in: path
        name: book_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - books
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookEditRequest'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sign-in or CSRF required.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found in your Collection.
        '405':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Method not allowed.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid fields or JSON.
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Send application/json.
  /api/v1/books/{book_id}/notes/:
    get:
      operationId: books_notes
      parameters:
      - in: path
        name: book_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: order
        schema:
          type: string
          enum:
          - newest
          - oldest
        description: Default oldest. Capture timestamp then UUID; newest reverses
          both.
      - in: query
        name: page
        schema:
          type: integer
        description: 1-based page; 20 Notes.
      tags:
      - books
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotePage'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sign-in or CSRF required.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found in your Collection.
        '405':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Method not allowed.
  /api/v1/notes/:
    get:
      operationId: notes_list
      parameters:
      - in: query
        name: page
        schema:
          type: integer
        description: 1-based page; 20 Notes.
      tags:
      - notes
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotePage'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sign-in or CSRF required.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found in your Collection.
        '405':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Method not allowed.
    post:
      operationId: notes_capture
      tags:
      - notes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sign-in or CSRF required.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found in your Collection.
        '405':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Method not allowed.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid fields or JSON.
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Send application/json.
  /api/v1/notes/{note_id}/:
    get:
      operationId: notes_read
      parameters:
      - in: path
        name: note_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - notes
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sign-in or CSRF required.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found in your Collection.
        '405':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Method not allowed.
    patch:
      operationId: notes_edit
      parameters:
      - in: path
        name: note_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - notes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sign-in or CSRF required.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found in your Collection.
        '405':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Method not allowed.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid fields or JSON.
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Send application/json.
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Stale revision; no change.
components:
  schemas:
    Book:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        author:
          type: string
      required:
      - author
      - id
      - title
    BookCreateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        author:
          type: string
          maxLength: 300
      required:
      - title
    BookEditRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        author:
          type: string
          maxLength: 300
    BookPage:
      type: object
      properties:
        count:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Book'
      required:
      - count
      - page
      - page_size
      - results
    CaptureRequest:
      type: object
      properties:
        content:
          $ref: '#/components/schemas/NoteContent'
        book:
          type:
          - string
          - 'null'
          format: uuid
      required:
      - content
    EditRequest:
      type: object
      properties:
        content:
          $ref: '#/components/schemas/NoteContent'
        book:
          type:
          - string
          - 'null'
          format: uuid
        revision:
          type: integer
          maximum: 9223372036854775806
          minimum: 1
          format: int64
      required:
      - revision
    Error:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - error
    ErrorDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        fields:
          type: object
          additionalProperties: {}
      required:
      - code
      - fields
      - message
    Note:
      type: object
      properties:
        id:
          type: string
          format: uuid
        content:
          $ref: '#/components/schemas/NoteContent'
        book:
          type:
          - string
          - 'null'
          format: uuid
        plain_text:
          type: string
        captured_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        revision:
          type: integer
          minimum: 1
      required:
      - book
      - captured_at
      - content
      - id
      - plain_text
      - revision
      - updated_at
    NoteBlock:
      oneOf:
      - $ref: '#/components/schemas/NoteParagraph'
      - $ref: '#/components/schemas/NoteBlockquote'
      - $ref: '#/components/schemas/NoteBulletList'
      - $ref: '#/components/schemas/NoteOrderedList'
    NoteBlockquote:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: blockquote
        content:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/NoteBlock'
      required:
      - type
      - content
    NoteBulletList:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: bulletList
        content:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/NoteListItem'
      required:
      - type
      - content
    NoteContent:
      description: Canonical version 1 Note content. Tiptap documents support paragraphs,
        bold/italic text, lists, quotations, hard breaks and absolute http/https links
        only. Legacy plain-text documents remain supported. Runtime validation additionally
        requires non-whitespace text, at most 100,000 projected characters, 10,000
        nodes, and depth 20 (root depth 0). Null characters and unpaired surrogates
        are forbidden. Text marks must have distinct types. See docs/api.md for projection
        and errors.
      oneOf:
      - type: object
        additionalProperties: false
        properties:
          version:
            type: integer
            const: 1
          format:
            type: string
            const: plain-text
          text:
            type: string
            minLength: 1
            maxLength: 100000
        required:
        - version
        - format
        - text
      - type: object
        additionalProperties: false
        properties:
          version:
            type: integer
            const: 1
          format:
            type: string
            const: tiptap
          doc:
            $ref: '#/components/schemas/NoteDocument'
        required:
        - version
        - format
        - doc
    NoteDocument:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: doc
        content:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/NoteBlock'
      required:
      - type
      - content
    NoteHardBreak:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: hardBreak
      required:
      - type
    NoteListItem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: listItem
        content:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/NoteBlock'
          prefixItems:
          - $ref: '#/components/schemas/NoteParagraph'
          description: A paragraph followed by zero or more supported blocks.
      required:
      - type
      - content
    NoteMark:
      oneOf:
      - type: object
        additionalProperties: false
        properties:
          type:
            type: string
            oneOf:
            - const: bold
            - const: italic
        required:
        - type
      - type: object
        additionalProperties: false
        properties:
          type:
            type: string
            const: link
          attrs:
            type: object
            additionalProperties: false
            properties:
              href:
                type: string
                maxLength: 2048
                pattern: ^[hH][tT][tT][pP][sS]?://[^\s\\]+$
                description: Absolute http/https URL with a host and valid port; no
                  whitespace, control characters or backslashes.
            required:
            - href
        required:
        - type
        - attrs
    NoteOrderedList:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: orderedList
        content:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/NoteListItem'
        attrs:
          type: object
          additionalProperties: false
          properties:
            start:
              type: integer
              minimum: 1
              maximum: 2147483647
          required:
          - start
      required:
      - type
      - content
    NotePage:
      type: object
      properties:
        count:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Note'
      required:
      - count
      - page
      - page_size
      - results
    NoteParagraph:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: paragraph
        content:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/NoteText'
            - $ref: '#/components/schemas/NoteHardBreak'
      required:
      - type
    NoteText:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: text
        text:
          type: string
          minLength: 1
          maxLength: 100000
        marks:
          type: array
          maxItems: 3
          uniqueItems: true
          items:
            $ref: '#/components/schemas/NoteMark'
      required:
      - type
      - text
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
