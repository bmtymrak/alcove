  /api/v1/books/{book_id}/note-groups/:
    get:
      operationId: books_note_groups
      parameters:
      - in: path
        name: book_id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: page
        schema:
          type: integer
        description: 1-based page; 20 Note appearances. Groups follow case-insensitive
          full Topic paths with Unassigned last. Notes within each group follow capture
          time then UUID. A group may continue on another page. Count includes each
          appearance.
      tags:
      - books
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
