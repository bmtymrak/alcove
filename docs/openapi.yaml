components:
  schemas:
    ActionEnum:
      enum:
      - assign
      - unassign
      type: string
      description: |-
        * `assign` - assign
        * `unassign` - unassign
    Book:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        author:
          type: string
      required:
      - author
      - id
      - title
    BookCreateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        author:
          type: string
          maxLength: 300
      required:
      - title
    BookEditRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        author:
          type: string
          maxLength: 300
    BookNoteGroup:
      type: object
      properties:
        topic:
          oneOf:
          - $ref: '#/components/schemas/Topic'
          - type: 'null'
        notes:
          type: array
          items:
            $ref: '#/components/schemas/Note'
      required:
      - notes
      - topic
    BookNoteGroupPage:
      type: object
      properties:
        count:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/BookNoteGroup'
      required:
      - count
      - page
      - page_size
      - results
    BookPage:
      type: object
      properties:
        count:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Book'
      required:
      - count
      - page
      - page_size
      - results
    CaptureRequest:
      type: object
      properties:
        topic_changes:
          type: array
          items:
            $ref: '#/components/schemas/TopicChangeRequest'
          description: Apply these operations in order. Assigning a Topic replaces
            assigned ancestors and descendants. Omission leaves assignments alone.
        book:
          type:
          - string
          - 'null'
          format: uuid
        chapter:
          type:
          - string
          - 'null'
          format: uuid
          description: Chapter of the selected Book. Null clears it. An omitted Chapter
            is cleared when the Book changes.
        page_number:
          type:
          - integer
          - 'null'
          maximum: 2147483647
          minimum: 1
          description: Starting page for numeric ordering. Null clears the anchor.
        source_reference:
          type: string
          description: Free-text location, such as a page range or footnote. Empty
            clears it.
        content:
          $ref: '#/components/schemas/NoteContent'
        capture_id:
          type: string
          format: uuid
          description: Use a new UUID for each capture. Retry the same content and
            source with the same UUID to receive the existing Note.
      required:
      - content
    Chapter:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          maxLength: 300
        position:
          type: integer
          minimum: 1
      required:
      - id
      - label
      - position
    ChapterCreateRequest:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 300
      required:
      - label
    ChapterEditRequest:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 300
        position:
          type: integer
          minimum: 1
          description: Move to this one-based position. Intervening Chapters shift.
    Conflict:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ConflictDetail'
      required:
      - error
    ConflictDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        fields:
          type: object
          additionalProperties: {}
        current_revision:
          type: integer
          minimum: 1
          description: Saved revision at conflict detection. Fetch and review before
            retrying.
      required:
      - code
      - current_revision
      - fields
      - message
    EditRequest:
      type: object
      properties:
        topic_changes:
          type: array
          items:
            $ref: '#/components/schemas/TopicChangeRequest'
          description: Apply these operations in order. Assigning a Topic replaces
            assigned ancestors and descendants. Omission leaves assignments alone.
        book:
          type:
          - string
          - 'null'
          format: uuid
        chapter:
          type:
          - string
          - 'null'
          format: uuid
          description: Chapter of the selected Book. Null clears it. An omitted Chapter
            is cleared when the Book changes.
        page_number:
          type:
          - integer
          - 'null'
          maximum: 2147483647
          minimum: 1
          description: Starting page for numeric ordering. Null clears the anchor.
        source_reference:
          type: string
          description: Free-text location, such as a page range or footnote. Empty
            clears it.
        content:
          $ref: '#/components/schemas/NoteContent'
        revision:
          type: integer
          maximum: 9223372036854775806
          minimum: 1
          format: int64
          description: Required last-read revision. A stale value returns 409 without
            changes.
      required:
      - revision
    Error:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
      required:
      - error
    ErrorDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        fields:
          type: object
          additionalProperties: {}
      required:
      - code
      - fields
      - message
    ModeEnum:
      enum:
      - promote_children
      - remove_subtree
      type: string
      description: |-
        * `promote_children` - promote_children
        * `remove_subtree` - remove_subtree
    Note:
      type: object
      properties:
        topics:
          type: array
          items:
            $ref: '#/components/schemas/Topic'
        id:
          type: string
          format: uuid
        content:
          $ref: '#/components/schemas/NoteContent'
        book:
          type:
          - string
          - 'null'
          format: uuid
        chapter:
          type:
          - string
          - 'null'
          format: uuid
        chapter_label:
          type:
          - string
          - 'null'
        page_number:
          type:
          - integer
          - 'null'
          maximum: 2147483647
          minimum: 1
        source_reference:
          type: string
        plain_text:
          type: string
        captured_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        revision:
          type: integer
          minimum: 1
          description: Current saved revision; increases on each successful edit.
      required:
      - book
      - captured_at
      - chapter
      - chapter_label
      - content
      - id
      - page_number
      - plain_text
      - revision
      - source_reference
      - topics
      - updated_at
    NoteBlock:
      oneOf:
      - $ref: '#/components/schemas/NoteParagraph'
      - $ref: '#/components/schemas/NoteBlockquote'
      - $ref: '#/components/schemas/NoteBulletList'
      - $ref: '#/components/schemas/NoteOrderedList'
    NoteBlockquote:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: blockquote
        content:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/NoteBlock'
      required:
      - type
      - content
    NoteBulletList:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: bulletList
        content:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/NoteListItem'
      required:
      - type
      - content
    NoteContent:
      description: Canonical version 1 Note content. Tiptap documents support paragraphs,
        bold/italic text, lists, quotations, hard breaks and absolute http/https links
        only. Legacy plain-text documents remain supported. Runtime validation additionally
        requires non-whitespace text, at most 100,000 projected characters, 10,000
        nodes, and depth 20 (root depth 0). Null characters and unpaired surrogates
        are forbidden. Text marks must have distinct types. See docs/api.md for projection
        and errors.
      oneOf:
      - type: object
        additionalProperties: false
        properties:
          version:
            type: integer
            const: 1
          format:
            type: string
            const: plain-text
          text:
            type: string
            minLength: 1
            maxLength: 100000
        required:
        - version
        - format
        - text
      - type: object
        additionalProperties: false
        properties:
          version:
            type: integer
            const: 1
          format:
            type: string
            const: tiptap
          doc:
            $ref: '#/components/schemas/NoteDocument'
        required:
        - version
        - format
        - doc
    NoteDocument:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: doc
        content:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/NoteBlock'
      required:
      - type
      - content
    NoteHardBreak:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: hardBreak
        marks:
          $ref: '#/components/schemas/NoteMarks'
      required:
      - type
    NoteLink:
      type: object
      properties:
        related_note:
          type: string
          format: uuid
      required:
      - related_note
    NoteLinkRequest:
      type: object
      properties:
        related_note:
          type: string
          format: uuid
      required:
      - related_note
    NoteListItem:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: listItem
        content:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/NoteBlock'
          prefixItems:
          - $ref: '#/components/schemas/NoteParagraph'
          description: A paragraph followed by zero or more supported blocks.
      required:
      - type
      - content
    NoteMark:
      oneOf:
      - type: object
        additionalProperties: false
        properties:
          type:
            type: string
            oneOf:
            - const: bold
            - const: italic
        required:
        - type
      - type: object
        additionalProperties: false
        properties:
          type:
            type: string
            const: link
          attrs:
            type: object
            additionalProperties: false
            properties:
              href:
                type: string
                maxLength: 2048
                pattern: ^[hH][tT][tT][pP][sS]?://[^\s\\]+$
                description: Absolute http/https URL with a host and valid port; no
                  whitespace, control characters or backslashes.
            required:
            - href
        required:
        - type
        - attrs
    NoteMarks:
      type: array
      maxItems: 3
      uniqueItems: true
      items:
        $ref: '#/components/schemas/NoteMark'
    NoteOrderedList:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: orderedList
        content:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/NoteListItem'
        attrs:
          type: object
          additionalProperties: false
          properties:
            start:
              type: integer
              minimum: 1
              maximum: 2147483647
          required:
          - start
      required:
      - type
      - content
    NotePage:
      type: object
      properties:
        count:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/Note'
      required:
      - count
      - page
      - page_size
      - results
    NoteParagraph:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: paragraph
        content:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/NoteText'
            - $ref: '#/components/schemas/NoteHardBreak'
      required:
      - type
    NoteText:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          const: text
        text:
          type: string
          minLength: 1
          maxLength: 100000
        marks:
          $ref: '#/components/schemas/NoteMarks'
      required:
      - type
      - text
    RelatedNote:
      type: object
      properties:
        topics:
          type: array
          items:
            $ref: '#/components/schemas/Topic'
        id:
          type: string
          format: uuid
        content:
          $ref: '#/components/schemas/NoteContent'
        book:
          type:
          - string
          - 'null'
          format: uuid
        chapter:
          type:
          - string
          - 'null'
          format: uuid
        chapter_label:
          type:
          - string
          - 'null'
        page_number:
          type:
          - integer
          - 'null'
          maximum: 2147483647
          minimum: 1
        source_reference:
          type: string
        plain_text:
          type: string
        captured_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        revision:
          type: integer
          minimum: 1
          description: Current saved revision; increases on each successful edit.
        book_title:
          type:
          - string
          - 'null'
      required:
      - book
      - book_title
      - captured_at
      - chapter
      - chapter_label
      - content
      - id
      - page_number
      - plain_text
      - revision
      - source_reference
      - topics
      - updated_at
    RelatedNotePage:
      type: object
      properties:
        count:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/RelatedNote'
      required:
      - count
      - page
      - page_size
      - results
    ResolutionEnum:
      enum:
      - keep_ancestors
      - keep_descendants
      type: string
      description: |-
        * `keep_ancestors` - keep_ancestors
        * `keep_descendants` - keep_descendants
    Topic:
      type: object
      properties:
        id:
          type: string
          format: uuid
        parent:
          type:
          - string
          - 'null'
          format: uuid
        label:
          type: string
          maxLength: 300
        path:
          type: array
          items:
            type: string
        ancestors:
          type: array
          items:
            type: string
            format: uuid
        full_path:
          type: string
      required:
      - ancestors
      - full_path
      - id
      - label
      - parent
      - path
    TopicAssignmentImpact:
      type: object
      properties:
        note:
          type: string
          format: uuid
        note_excerpt:
          type: string
        topic:
          $ref: '#/components/schemas/Topic'
        ancestor:
          oneOf:
          - $ref: '#/components/schemas/Topic'
          - type: 'null'
          description: Conflicting ancestor assignment, if any.
      required:
      - ancestor
      - note
      - note_excerpt
      - topic
    TopicChangeRequest:
      type: object
      properties:
        action:
          $ref: '#/components/schemas/ActionEnum'
        topic:
          type: string
          format: uuid
      required:
      - action
      - topic
    TopicCreateRequest:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 300
        parent:
          type:
          - string
          - 'null'
          format: uuid
      required:
      - label
    TopicImpact:
      type: object
      properties:
        topic:
          $ref: '#/components/schemas/Topic'
        new_path:
          type:
          - string
          - 'null'
          description: Updated full path, or null for a removed Topic.
      required:
      - new_path
      - topic
    TopicMoveDestinationRequest:
      type: object
      properties:
        parent:
          type:
          - string
          - 'null'
          format: uuid
          description: New parent UUID or null for root.
      required:
      - parent
    TopicMoveRequest:
      type: object
      properties:
        parent:
          type:
          - string
          - 'null'
          format: uuid
          description: New parent UUID or null for root.
        confirmation:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[0-9a-f]{64}$
        resolution:
          allOf:
          - $ref: '#/components/schemas/ResolutionEnum'
          description: |-
            Required when the preview lists conflicting assignments.

            * `keep_ancestors` - keep_ancestors
            * `keep_descendants` - keep_descendants
      required:
      - confirmation
      - parent
    TopicPreview:
      type: object
      properties:
        topics:
          type: array
          items:
            $ref: '#/components/schemas/TopicImpact'
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/TopicAssignmentImpact'
        confirmation:
          type: string
          description: Pass this token with the same destination or removal mode to
            apply.
      required:
      - assignments
      - confirmation
      - topics
    TopicRemovalModeRequest:
      type: object
      properties:
        mode:
          $ref: '#/components/schemas/ModeEnum'
      required:
      - mode
    TopicRemovalRequest:
      type: object
      properties:
        mode:
          $ref: '#/components/schemas/ModeEnum'
        confirmation:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^[0-9a-f]{64}$
      required:
      - confirmation
      - mode
    TopicRenameRequest:
      type: object
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 300
      required:
      - label
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
