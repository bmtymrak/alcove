openapi: 3.1.0
info:
  title: Alcove API
  version: 1.0.0
  description: Private same-origin session API. Sign in at /login/ with CSRF. Send
    the csrftoken cookie in X-CSRFToken on POST/PATCH/DELETE. Notes use stable UUIDs
    and UTC timestamps. See docs/api.md.
paths:
  /api/v1/books/:
    get:
      operationId: books_list
      parameters:
      - in: query
        name: page
        schema:
          type: integer
        description: 1-based page; 20 Books ordered by title then UUID.
      tags:
      - books
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookPage'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sign-in or CSRF required.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found in your Collection.
        '405':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Method not allowed.
    post:
      operationId: books_create
      tags:
      - books
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookCreateRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Sign-in or CSRF required.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Not found in your Collection.
        '405':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Method not allowed.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Invalid fields or JSON.
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Send application/json.
