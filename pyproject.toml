[project]
name = "alcove"
version = "0.1.0"
description = "A private collection of reading notes"
requires-python = ">=3.11,<3.14"
dependencies = [
  "django>=5.2,<5.3",
  "djangorestframework>=3.16,<3.17",
  "drf-spectacular>=0.28,<0.30",
]

[dependency-groups]
dev = [
  "django-stubs[compatible-mypy]>=5.2,<5.3",
  "djangorestframework-stubs>=3.16,<3.17",
  "pytest>=8,<10",
  "pytest-django>=4.11,<5",
  "pytest-playwright>=0.7,<0.9",
  "jsonschema>=4.25,<5",
  "types-jsonschema>=4.25,<5",
  "ruff>=0.14,<0.15",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]

[tool.mypy]
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
files = ["alcove", "config"]
exclude = ["migrations/"]
check_untyped_defs = true
disallow_untyped_defs = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
