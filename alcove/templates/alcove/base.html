{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Alcove{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'alcove/app.css' %}">
</head>
<body>
  <header>
    <a class="brand" href="{% url 'index' %}">Alcove</a>
    {% if user.is_authenticated %}
    <nav aria-label="Main navigation">
      <a href="{% url 'index' %}">Books</a>
      <a href="{% url 'notes' %}">All notes</a>
      <a href="{% url 'topic-tree' %}">Topics</a>
      <a href="{% url 'note-trash' %}">Trash</a>
      <span>{{ user.username }}</span>
      <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="quiet">Sign out</button></form>
    </nav>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
