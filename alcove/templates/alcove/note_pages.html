<nav aria-label="Note pages">
  {% if note_page.has_previous %}
  <a href="{% if filters %}{% querystring page=note_page.previous_page_number %}{% else %}?{% if query %}q={{ query|urlencode }}&amp;{% endif %}{% if order %}order={{ order }}&amp;{% endif %}{% if mode %}mode={{ mode }}&amp;{% endif %}page={{ note_page.previous_page_number }}{% endif %}">Previous</a>
  {% endif %}
  <span>Page {{ note_page.number }} of {{ note_page.paginator.num_pages }}</span>
  {% if note_page.has_next %}
  <a href="{% if filters %}{% querystring page=note_page.next_page_number %}{% else %}?{% if query %}q={{ query|urlencode }}&amp;{% endif %}{% if order %}order={{ order }}&amp;{% endif %}{% if mode %}mode={{ mode }}&amp;{% endif %}page={{ note_page.next_page_number }}{% endif %}">Next</a>
  {% endif %}
</nav>
